{% extends "face_capture/base.html" %}

{% block title %}Admin Access | FaceSecure AI{% endblock %}

{% block content %}
<div class="container animate-fade-in py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card overflow-hidden">
                <div class="p-5 text-center bg-white bg-opacity-5 border-bottom border-white border-opacity-10">
                    <div class="icon-circle mx-auto bg-primary bg-opacity-10 text-primary mb-3">
                        <i class="fas fa-user-shield fa-2x"></i>
                    </div>
                    <h3 class="mb-1">Control Center</h3>
                    <p class="text-muted small text-uppercase fw-bold mb-0">Authorized Personnel Only</p>
                </div>
                
                <div class="p-5">
                    {% if error %}
                    <div class="p-3 rounded-4 mb-4 bg-danger bg-opacity-10 border border-danger border-opacity-20 text-danger small text-center">
                        <i class="fas fa-exclamation-circle me-2"></i> {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label small text-muted text-uppercase fw-bold mb-2">Access Key</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-muted" style="border-radius: 12px 0 0 12px;">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="form-control bg-transparent border-white border-opacity-10 text-white" style="border-radius: 0 12px 12px 0;" name="username" placeholder="Username" required>
                            </div>
                        </div>
                        
                        <div class="mb-5">
                            <label class="form-label small text-muted text-uppercase fw-bold mb-2">Secure Phrase</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-end-0 border-white border-opacity-10 text-muted" style="border-radius: 12px 0 0 12px;">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control bg-transparent border-white border-opacity-10 text-white" style="border-radius: 0 12px 12px 0;" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-premium w-100 py-3 shadow-lg">
                            <i class="fas fa-sign-in-alt me-2"></i> Authenticate
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Default credentials: <span class="text-white">admin / admin</span></p>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'index' %}" class="text-muted text-decoration-none small hover-white transition-all">
                    <i class="fas fa-arrow-left me-1"></i> Return to Main Terminal
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .input-group-text {
        border-color: rgba(255, 255, 255, 0.1);
    }
    .hover-white:hover {
        color: white !important;
    }
    .form-control:focus {
        background: rgba(255, 255, 255, 0.05) !important;
        box-shadow: none;
        border-color: var(--primary) !important;
    }
</style>
{% endblock %}
